[package]
name = "ssv"
version = "0.5.0"
edition = "2024"
description = "CLI that manages SSH key pairs and per-host configuration files under ~/.ssh/conf.d"
repository = "https://github.com/akitorahayashi/ssv"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
git2 = { version = "0.20", default-features = false }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
