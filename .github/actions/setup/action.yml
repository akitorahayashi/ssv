name: "Setup Rust Environment"
description: "Installs Rust, caches Cargo dependencies, and optionally installs mise tools"
inputs:
  install-mise:
    description: "Install mise and optional tools"
    required: false
    default: "false"
  mise-version:
    description: "mise version to install"
    required: false
    default: "2026.2.19"
  mise-tools:
    description: "mise install arguments (space-separated, e.g., cargo:cargo-tarpaulin actionlint)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install repository Rust toolchain
      run: rustup show active-toolchain
      shell: bash

    - name: Cache Cargo dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Setup mise with locked project tools
      if: inputs.install-mise == 'true' && inputs.mise-tools == ''
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ inputs.mise-version }}
        install_args: --locked

    - name: Setup mise with requested tools
      if: inputs.install-mise == 'true' && inputs.mise-tools != ''
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ inputs.mise-version }}
        install_args: --locked ${{ inputs.mise-tools }}
