name: Setup Build
description: Install mise-managed just, the Rust toolchain, and Rust build cache for CI

runs:
  using: "composite"
  steps:
    - name: Setup mise with locked project tools
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: '2026.2.19'
        install_args: --locked just

    - name: Set up Rust toolchain
      shell: bash
      run: rustup toolchain install 1.90.0 --profile default --component clippy --component rustfmt

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
